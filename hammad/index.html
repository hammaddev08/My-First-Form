<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Professional Login Form</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;

    }

    .container {
      width: 420px;
      background: #fff;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, .15);
    }

    .container h1 {
      text-align: center;
      font-size: 30px;
      color: #333;
      margin-bottom: 8px;
    }

    .container p {
      text-align: center;
      color: #777;
      margin-bottom: 30px;
      font-size: 15px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #444;
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: .3s;
    }

    .form-group input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 4px rgba(102, 126, 234, .15);
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .options label {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #555;
    }

    .options a {
      text-decoration: none;
      color: #667eea;
      font-weight: 500;
    }

    .options a:hover {
      text-decoration: underline;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #667eea;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: .3s;
    }

    button:hover {
      background: #5563d8;
      transform: translateY(-2px);
    }

    .signup {
      text-align: center;
      margin-top: 25px;
      font-size: 14px;
      color: #666;
    }

    .signup a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }

    .signup a:hover {
      text-decoration: underline;
    }
  </style>

</head>

<body>

  <div class="container">

    <h1>Welcome Back</h1>
    <p>Sign in to continue to your account</p>

    <form action="/login" method="POST">

      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter your username" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
      </div>

      <div class="options">
        <label>
          <input type="checkbox">
          Remember Me
        </label>

        <a href="#">Forgot Password?</a>
      </div>

      <button type="submit">
        Login
      </button>

    </form>

    <div class="signup">
      Don't have an account?
      <a href="#">Create Account</a>
    </div>

  </div>

</body>

</html>
