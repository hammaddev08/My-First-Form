<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Star Portal</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>

  <!-- ==================== BACKGROUND TWINKLING STARS ==================== -->
  <div class="bg-stars" id="bgStars"></div>

  <!-- ==================== MAIN CONTAINER ==================== -->
  <div class="main-container">

    <!-- ========== LEFT PANEL: STARS PYRAMID ========== -->
    <div class="left-panel">
      <p class="pyramid-label">✦ Star Pyramid ✦</p>
      <div class="pyramid-wrapper">
        <div id="pyramid-display"></div>
      </div>
      <p class="pyramid-subtitle">every star tells a story</p>
    </div>

    <!-- ========== RIGHT PANEL: LOGIN FORM ========== -->
    <div class="right-panel">
      <div class="form-container">
        <div class="form-header">
          <div class="welcome-icon">🔐</div>
          <h2>Welcome Back</h2>
          <p>Sign in to continue your journey</p>
        </div>

        <form id="loginForm" autocomplete="off">
          <!-- Username -->
          <div class="input-group">
            <label for="username">Username</label>
            <div class="input-wrapper">
              <span class="input-icon">👤</span>
              <input type="text" id="username" placeholder="Enter your username" autocomplete="off" />
            </div>
          </div>

          <!-- Password -->
          <div class="input-group">
            <label for="password">Password</label>
            <div class="input-wrapper">
              <span class="input-icon">🔒</span>
              <input type="password" id="password" placeholder="Enter your password" autocomplete="off" />
            </div>
          </div>

          <!-- Login Button -->
          <button type="submit" class="login-btn">Sign In →</button>
        </form>

        <!-- Hint: Mock Credentials -->
        <div class="hint-section">
          <p class="hint-title">📋 Demo Credentials</p>
          <div class="hint-row">
            <span class="dot"></span> <code>admin</code> / <code>admin123</code>
          </div>
          <div class="hint-row">
            <span class="dot"></span> <code>user</code> / <code>user123</code>
          </div>
          <div class="hint-row">
            <span class="dot"></span> <code>guest</code> / <code>guest123</code>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
